<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in · Trading Journal</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-[#0b0f17] text-slate-200 min-h-screen grid place-items-center font-sans">
  <form method="post" action="/login" class="w-full max-w-sm bg-[#111827] border border-slate-700/60 rounded-2xl p-8 shadow-2xl">
    <div class="flex items-center gap-2 mb-6">
      <div class="h-9 w-9 rounded-lg bg-gradient-to-br from-indigo-500 to-cyan-400 grid place-items-center font-bold text-slate-900">TJ</div>
      <div><div class="font-semibold text-white">Trading Journal</div><div class="text-xs text-slate-500">Private — sign in to continue</div></div>
    </div>
    {% if error %}<div class="mb-4 text-sm rounded-lg bg-rose-500/15 text-rose-200 px-3 py-2">{{ error }}</div>{% endif %}
    {% if not configured %}<div class="mb-4 text-sm rounded-lg bg-amber-500/15 text-amber-200 px-3 py-2">APP_PASSWORD is not set on the server, so login is disabled.</div>{% endif %}
    <input type="hidden" name="next" value="{{ next }}">
    <label class="text-xs uppercase tracking-wide text-slate-400 font-semibold">Password</label>
    <input type="password" name="password" autofocus autocomplete="current-password" class="mt-1 w-full rounded-lg bg-[#0b1220] border border-slate-700 px-3 py-2 focus:outline-none focus:border-indigo-500">
    <button class="mt-5 w-full rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white py-2 font-medium">Log in</button>
  </form>
</body></html>
