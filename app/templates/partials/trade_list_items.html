    {% for r in nav_rows %}{% set cur = r.id == cur_id %}
    <a href="/trades/{{ r.id }}{{ '?' ~ list_qs if list_qs }}" data-tl-item data-sym="{{ r.symbol|lower }}" class="flex items-stretch gap-2 px-2 py-1.5 rounded-md {{ 'bg-indigo-500/20 ring-1 ring-indigo-500/50' if cur else 'hover:bg-slate-800/70' }}"{% if cur %} aria-current="page"{% endif %}>
      <span class="w-1 rounded {{ {'OPEN': 'bg-sky-400', 'WIN': 'bg-emerald-400', 'LOSS': 'bg-rose-400'}.get(outcome_label(r), 'bg-slate-500') }}"></span>
      <span class="min-w-0 flex-1">
        <span class="flex justify-between gap-2"><span class="text-white font-medium truncate">{{ r.symbol }}</span><span class="{{ r.net_pnl|pnl_class }} tabular-nums">{{ r.net_pnl|money(sym=list_symbol) }}</span></span>
        <span class="flex justify-between gap-2 text-[11px] text-slate-500"><span>{{ r.opened_at|local_dt('%b %d') }} · {{ 'L' if r.direction == 'LONG' else 'S' }}</span><span>{{ outcome_label(r) }}</span></span>
      </span>
    </a>
    {% else %}<div class="text-xs text-slate-500 p-3">No trades match the filter.</div>{% endfor %}
