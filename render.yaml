# Render Blueprint: web service + Postgres (both free plan).
# Secrets marked `sync: false` must be entered in the Render dashboard.
databases:
  - name: trading-journal-db
    databaseName: trading_journal
    user: trading_journal
    plan: free            # NOTE: Render free Postgres expires 30 days after creation; upgrade to keep data.
    region: oregon

services:
  - type: web
    name: trading-journal
    runtime: python
    plan: free            # free instances sleep after ~15 min idle (first request then takes ~1 min)
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    # Migrations run on every start (pre-deploy commands aren't available on the free plan).
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: trading-journal-db
          property: connectionString
      - key: APP_PASSWORD          # your login password
        sync: false
      - key: SECRET_KEY            # signs the session cookie
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY  # encrypts broker OAuth tokens at rest
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: DISPLAY_TZ
        value: America/New_York
      - key: PRICE_PROVIDER        # auto = schwab -> polygon -> yahoo; "none" disables charts
        value: auto
      - key: POLYGON_API_KEY
        sync: false
      # Schwab via SnapTrade (Personal API key). Leave unset to keep the source disabled.
      - key: SNAPTRADE_CLIENT_ID
        sync: false
      - key: SNAPTRADE_CONSUMER_KEY
        sync: false
      # Optional Schwab Trader API source (US retail accounts only). Leave unset to keep it disabled.
      - key: SCHWAB_APP_KEY
        sync: false
      - key: SCHWAB_APP_SECRET
        sync: false
      - key: SCHWAB_CALLBACK_URL   # e.g. https://<service>.onrender.com/auth/schwab/callback
        sync: false

# No scheduled sync, by design: syncing is manual only ("Sync now" in the app, or
# `python -m app.sync` from a shell). No cron job, no GitHub Actions schedule, nothing paid.
